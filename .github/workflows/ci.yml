name: Python CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff auto-fix
        run: uv run ruff check . --fix --unsafe-fixes

      - name: Ruff format
        run: uv run ruff format .

      - name: Commit Ruff fixes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply ruff fixes"
            git push
          fi

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests if present
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests directory found"
          fi

      - name: Bandit security scan
        run: uv run bandit -r . -x ./tests,./.venv,./venv
        continue-on-error: true

      - name: Dependency audit
        run: uv run pip-audit
        continue-on-error: true
