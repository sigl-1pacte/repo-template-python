name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-api.yml'
              - 'monorepo.config.yml'
              - 'generate.py'

  api:
    name: api
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    uses: ./.github/workflows/ci-api.yml
    with:
      app-name: api
      app-path: apps/api
      python-version: "3.12"

